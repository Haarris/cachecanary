[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cachecanary"
version = "0.1.0"
description = "CacheCanary: know the moment your Claude prompt cache breaks on Amazon Bedrock, not when the bill arrives."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
aws = ["boto3[crt]>=1.34"]  # crt: needed for credentials from `aws login`
dev = ["pytest>=8"]

[project.scripts]
cachecanary = "cachecanary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
