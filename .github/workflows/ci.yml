name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --quiet -e ".[dev]"
      - run: python -m pytest -q

  action-selftest:
    # Runs the GitHub Action from this repo exactly as users would (no AWS needed for lint/diff).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: lint on a good request (must pass)
        uses: ./
        with:
          command: lint
          args: examples/request_good.json

      - name: lint on a too-short request (must fail)
        id: lint_short
        continue-on-error: true
        uses: ./
        with:
          command: lint
          args: examples/request_too_short.json

      - name: diff of two requests with a changing date (must fail)
        id: diff_changed
        continue-on-error: true
        uses: ./
        with:
          command: diff
          args: examples/request_bad.json examples/request_next.json

      - name: unknown command (must fail)
        id: bad_command
        continue-on-error: true
        uses: ./
        with:
          command: nope
          args: examples/request_good.json

      - name: check expected failures
        shell: bash
        run: |
          set -euo pipefail
          for o in "${{ steps.lint_short.outcome }}" "${{ steps.diff_changed.outcome }}" "${{ steps.bad_command.outcome }}"; do
            if [ "$o" != "failure" ]; then echo "::error::expected failure, got '$o'"; exit 1; fi
          done
          echo "All expected failures happened."
